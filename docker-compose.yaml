
services:
  idocker-registry:
    #build: .
    image: idocker-registry:0.9.9
    container_name: idocker-registry
    ports:
      - "7588:7518"
      #- "7519:7519"
    volumes:
      - ./test/registry-data:/var/lib/registry
      - ./test/app-data:/app/data
      - ./test/app-logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=7518
      - DOCKER_REGISTRY_URL=http://localhost:7519
      - IDOCKER_REGISTRY_URL=http://localhost:7518
      - DB_PATH=/app/data/registry.db
      - LOG_DIR=/app/logs
      - LOG_LEVEL=info
      - JWT_SECRET=your_jwt_secret_key_here_change_in_production
      - JWT_EXPIRES_IN=24h
      - DEFAULT_ADMIN_PASSWORD=admin123
      - ALLOW_USER_REGISTRATION=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7518/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

