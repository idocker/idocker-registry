services:
  idocker-registry:
    # 镜像可由环境变量覆盖，便于直接使用 Docker Hub 官方镜像而不改文件：
    #   IDOCKER_IMAGE=idockervip/idocker-registry:2.0.4 docker compose up -d
    # 不设时用本地构建的 tag。
    image: ${IDOCKER_IMAGE:-idocker-registry:2.0.5}
    container_name: idocker-registry
    ports:
      - "7588:7518"
    volumes:
      - ./registry:/var/lib/registry
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      # 对外访问地址：决定 CORS 的 origin 与对外 URL 拼接。
      # 不能省——config/env.js 里的默认值是开发用的 http://localhost:7518。
      - IDOCKER_REGISTRY_URL=https://idocker.vip
      # JWT 签名密钥无需设置：首次启动会自动生成随机密钥并以 JWT_SECRET=... 写入
      # /app/data/.env，重启后复用。只有需要多实例共享同一密钥时才显式指定：
      # - JWT_SECRET=change-me
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7518/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

