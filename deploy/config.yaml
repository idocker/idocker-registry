version: 0.1
log:
  level: info
storage:
  delete:
    enabled: true
  cache:
    blobdescriptor: inmemory
  filesystem:
    rootdirectory: /var/lib/registry
http:
  addr: :7519
  net: tcp
  # Return relative Location URLs so the Docker client resolves them against its
  # own registry base URL instead of the internal localhost:7519 address
  relativeurls: true
  # No authentication required, internal access only
  headers:
    X-Content-Type-Options: [nosniff]
health:
  storagedriver:
    enabled: true
    interval: 10s
    threshold: 3
