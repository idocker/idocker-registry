version: '3.8'

services:
  idocker-registry:
    build: .
    container_name: idocker-registry
    ports:
      - "8080:8080"
    volumes:
      - registry-data:/var/lib/registry
      - app-data:/app/data
      - app-logs:/app/logs
    environment:
      - NODE_ENV=production
      - PORT=8080
      - REGISTRY_URL=http://localhost:5000
      - DB_PATH=/app/data/registry.db
      - LOG_DIR=/app/logs
      - LOG_LEVEL=info
      - JWT_SECRET=your_jwt_secret_key_here_change_in_production
      - JWT_EXPIRES_IN=24h
      - DEFAULT_ADMIN_PASSWORD=admin123
      - ALLOW_USER_REGISTRATION=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  registry-data:
    driver: local
  app-data:
    driver: local
  app-logs:
    driver: local
